<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>WGPU & Odin</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body id="body">
		<div class="buttonGroup">
		<button id="playBtn" onclick="this.blur()">Pause</button>
		<button id="resetBtn" onclick="this.blur()">Reset</button>
		</div>
		<canvas id="wgpu-canvas"></canvas>
		<script type="text/javascript" src="odin.js"></script>
		<script type="text/javascript" src="wgpu.js"></script>
		<script type="text/javascript">
			(async () => {
				const mem = new WebAssembly.Memory({ initial: 2000, maximum: 65536, shared: false });
				const memInterface = new odin.WasmMemoryInterface();
				memInterface.setMemory(mem);

				const wgpuInterface = new odin.WebGPUInterface(memInterface);

				await odin.runWasm("triangle.wasm", null, { wgpu: wgpuInterface.getInterface() }, memInterface, /*intSize=8*/);

				const button = document.getElementById('playBtn');
				setInterval(() => {
					const isRunning = memInterface.exports.get_running_state();
					button.textContent = isRunning ? "Pause" : "Play";
				}, 16);
			})();
		</script>
	</body>
</html>
