		<script type="text/javascript">
			(async () => {
				const mem = new WebAssembly.Memory({ initial: 2000, maximum: 65536, shared: false });

				window.memInterface = new odin.WasmMemoryInterface();

				const memInterface = window.memInterface;
				memInterface.setMemory(mem);

				const wgpuInterface = new odin.WebGPUInterface(memInterface);

				await odin.runWasm("triangle.wasm", null, { wgpu: wgpuInterface.getInterface() }, memInterface, /*intSize=8*/);

				function syncFromCamera() {
					const zoomEl = document.getElementById("zoom");
					setFieldValue(zoomEl, memInterface.exports.get_zoom());
				}

				syncFromCamera();

				const playBtn = document.getElementById('playBtn');
				setInterval(() => {
					const isRunning = memInterface.exports.get_running_state();
					playBtn.textContent = isRunning ? "Pause" : "Play";
				}, 16);

				const rotateBtn = document.getElementById('rotateBtn');
				setInterval(() => {
					const isRotating = memInterface.exports.get_rotate_state();
					rotateBtn.textContent = isRotating ? "Stop" : "Rotate";
				}, 16);
			})();
		</script>




<!-- tab logic -->
<script>
function showTab(id, el) {

	document.querySelectorAll('.tab-content')
		.forEach(e => e.classList.remove('active'));

	document.querySelectorAll('.tab')
		.forEach(e => e.classList.remove('active'));

	document.getElementById(id).classList.add('active');
	el.classList.add('active');
}
</script>



<!-- nuolet -->

<script>

document.querySelectorAll(".control-row").forEach(group => {

	const field = group.querySelector(".drag-field");

	if (!field) return;

	const minus = group.querySelector(".minus");
	const plus = group.querySelector(".plus");

	function holdButton(callback) {

		let interval;

		return {
			start() {
				callback();
				interval = setInterval(callback, 120);
			},

			stop() {
				clearInterval(interval);
			}
		};
	}

	const minusHold = holdButton(() => {
		let value = getFieldValue(field);
		value--;
		setFieldValue(field, value);
	});

	const plusHold = holdButton(() => {
		let value = getFieldValue(field);
		value++;
		setFieldValue(field, value);
	});

	/* minus */

	minus?.addEventListener("mousedown", minusHold.start);

	minus?.addEventListener("mouseup", minusHold.stop);
	minus?.addEventListener("mouseleave", minusHold.stop);

	/* plus */

	plus?.addEventListener("mousedown", plusHold.start);

	plus?.addEventListener("mouseup", plusHold.stop);
	plus?.addEventListener("mouseleave", plusHold.stop);

	/* mobile */

	minus?.addEventListener("touchstart", minusHold.start);
	minus?.addEventListener("touchend", minusHold.stop);

	plus?.addEventListener("touchstart", plusHold.start);
	plus?.addEventListener("touchend", plusHold.stop);

});

</script>
